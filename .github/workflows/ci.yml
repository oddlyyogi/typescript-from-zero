name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter:
          - chapters/01-run-typescript-without-a-build-step
          - chapters/02-functions-that-keep-their-promises
          - chapters/03-shaping-data-objects-arrays-and-tuples
          - chapters/04-either-this-or-that-union-and-literal-types
          - chapters/05-narrowing-let-typescript-follow-your-checks
          - chapters/06-constants-without-enums-as-const
          - chapters/07-modules-import-export-and-type-only-imports
          - chapters/08-classes-without-baggage
          - chapters/09-generics-write-it-once-use-it-safely
          - chapters/10-utility-types-partial-pick-omit-readonly
          - chapters/11-interface-or-type-alias
          - chapters/12-dictionaries-records-maps-index-signatures
          - chapters/13-functions-as-values-callbacks
          - chapters/14-mapped-types-loops-for-types
          - chapters/15-conditional-types-and-infer
          - chapters/16-template-literal-types
          - chapters/17-null-and-undefined-safely
          - chapters/18-unknown-vs-any
          - chapters/19-type-guards
          - chapters/20-error-handling-throw-catch-result
          - chapters/21-async-await-and-promises
          - chapters/22-validating-data-by-hand
          - chapters/23-tsconfig-strictness-flags
          - chapters/24-type-assertions-as-const-satisfies
          - chapters/25-project-setup-node-typescript
          - chapters/26-the-ticket-store-map-readonly
          - chapters/27-saving-tickets-to-json-files
          - chapters/28-command-line-args-and-exhaustive-switch
          - chapters/29-filter-sort-group-generics
          - chapters/30-state-machines-discriminated-unions
          - chapters/31-testing-with-node-test
          - chapters/32-the-whole-project-end-to-end
          - chapters/33-npm-scripts-that-run-your-project
          - chapters/34-declaration-files-d-ts
          - chapters/35-building-for-production-tsc-emit
          - chapters/36-stack-traces-and-source-maps
          - chapters/37-subpath-imports-no-more-dot-dot-slash
          - chapters/38-jsdoc-types-in-javascript-files
          - chapters/39-settings-and-env-files
          - chapters/40-continuous-integration-with-github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: ${{ matrix.chapter }}
        run: npm install
      - name: Type-check
        working-directory: ${{ matrix.chapter }}
        run: npm run check
      - name: Run
        working-directory: ${{ matrix.chapter }}
        run: npm start
